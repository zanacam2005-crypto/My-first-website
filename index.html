<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شیرینی زانا</title>
<style>
:root{--brown:#6b351f;--gold:#d6a354;--cream:#fff8ed;--ink:#2b211c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--brown);color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;color:#ffe0a4}nav a{color:white;text-decoration:none;margin:0 8px}.hero{text-align:center;padding:55px 20px;background:linear-gradient(135deg,#fff1d6,#f4d5a5)}.hero h2{font-size:clamp(28px,6vw,48px);margin:0 0 12px;color:var(--brown)}.hero p{font-size:18px}.btn{background:var(--brown);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:35px 18px}h2{text-align:center;color:var(--brown)}.filters{text-align:center;margin:20px}.filters button{margin:5px;border:1px solid var(--gold);background:white;border-radius:20px;padding:9px 15px;cursor:pointer}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #ead7bd;border-radius:16px;padding:20px;text-align:center;box-shadow:0 5px 16px #6b351f12}.symbol{font-size:48px}.card h3{color:var(--brown)}.price{color:#9b641d;font-weight:bold;margin:12px}.order{background:white;border:2px solid var(--gold);border-radius:16px;padding:24px;margin-top:35px}.order input,.order textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #d8c4a8;border-radius:8px;font:inherit}.order-list{min-height:35px}.total{font-size:20px;font-weight:bold;color:var(--brown)}footer{text-align:center;background:var(--brown);color:white;padding:25px;margin-top:35px}@media(max-width:600px){header{justify-content:center;text-align:center}}
</style>
</head>
<body>
<header><h1>🍰 شیرینی زانا</h1><nav><a href="#products">بەرهەمەکان</a><a href="#order">ئۆردەر</a></nav></header>
<section class="hero"><h2>خۆشترین تامی شیرینی</h2><p>شیرینییە تازە و خۆشەکان بۆ بۆنە و ڕۆژانی تایبەت</p><a class="btn" href="#products">بینینی بەرهەمەکان</a></section>
<main class="wrap"><h2 id="products">بەرهەمەکانمان</h2><div class="filters"><button data-filter="all">هەموو</button><button data-filter="tray">سینی</button><button data-filter="box">کارتۆن</button><button data-filter="bag">کیسە</button></div><section class="products" id="productGrid"></section><section class="order" id="order"><h2>فۆڕمی ئۆردەر</h2><div class="order-list" id="orderList">هێشتا هیچ بەرهەمێک زیاد نەکراوە.</div><p class="total" id="total">کۆی گشتی: ٠ دینار</p><input id="customer" placeholder="ناوی مشتری"><input id="phone" placeholder="ژمارەی مۆبایل"><textarea id="address" placeholder="ناونیشان و تێبینی ئۆردەر"></textarea><button class="btn" id="send">ناردنی داواکاری</button></section></main><footer>شیرینی زانا — تامی خۆش، خۆشحاڵی زۆر</footer>
<script>
const products=[['پاقلاوە','tray','🍯',2200],['داتلی','tray','🌰',2200],['دهنە','tray','🥮',2200],['زنود','tray','🍮',2200],['چۆرەك','box','🥐',2500],['بەقسەم','bag','🍪',2000],['کاب‌کێک','box','🧁',3000],['کونافە','tray','🍮',2500]];let cart=[];const grid=document.querySelector('#productGrid');function render(filter='all'){grid.innerHTML=products.filter(p=>filter==='all'||p[1]===filter).map((p,i)=>`<article class="card"><div class="symbol">${p[2]}</div><h3>${p[0]}</h3><div class="price">${p[3].toLocaleString('en-US')} دینار</div><button class="btn" onclick="add(${products.indexOf(p)})">زیادکردن بۆ ئۆردەر</button></article>`).join('')}function add(i){cart.push(products[i]);renderCart()}function renderCart(){document.querySelector('#orderList').innerHTML=cart.length?cart.map((p,i)=>`${i+1}. ${p[0]} — ${p[3].toLocaleString('en-US')} دینار`).join('<br>'):'هێشتا هیچ بەرهەمێک زیاد نەکراوە.';document.querySelector('#total').textContent='کۆی گشتی: '+cart.reduce((s,p)=>s+p[3],0).toLocaleString('en-US')+' دینار'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>render(b.dataset.filter));document.querySelector('#send').onclick=()=>{if(!cart.length)return alert('تکایە بەرهەمێک هەڵبژێرە.');alert('سوپاس '+(document.querySelector('#customer').value||'بەڕێز مشتری')+'، داواکارییەکەت تۆمار کرا.');};render();
</script></body></html>
